<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 3 - Table</title>
</head>
<body>
	<table border="1" width="100%">
		<tr>
			<th rowspan="3">Day</th>
			<th colspan="3">Seminar</th>
		</tr>
		<tr>
			<th colspan="2">Schedule</th>
			<th rowspan="2">Topic</th>
		</tr>
		<tr>
			<th>Begin</th>
			<th>End</th>
		</tr>
		<tr>
			<td rowspan="2">Monday</td>
			<td rowspan="2" style="background-color: #FEFFCF;">8:00 a.m.</td>
			<td rowspan="2" style="background-color:#D6ABFE ;">5:00 p.m.</td>
			<td>Introduction to XML</td>
		</tr>
		<tr>
			<td>Validity:DTD and Relex NG</td>
		</tr>
		<tr>
			<td rowspan="3">Tuesday</td>
			<td style="background-color: #FEFFCF;">8:00 a.m.</td>
			<td style="background-color:#FEFFCF ;">11:00 a.m.</td>
			<td rowspan="2">XPath</td>
		</tr>
		<tr>
			<td style="background-color: #FEFFCF;">11:00 a.m.</td>
			<td style="background-color:#BDFDC3 ;">2:00 p.m.</td>
		</tr>
		<tr>
			<td style="background-color: #BDFDC3;">2:00 a.m.</td>
			<td style="background-color:#D6ABFE ;">5:00 p.m.</td>
			<td>XSL Transformation</td>
			
		</tr>
		<tr>
			<td>Wednesday</td>
			<td style="background-color:#FEFFCF ;">8:00 a.m.</td>
			<td style="background-color:#BDFDC3 ;">12:00 p.m.</td>
			<td rowspan="2">XSL Formatting Objects</td>
		</tr>
	</table>
</body>
</html>
