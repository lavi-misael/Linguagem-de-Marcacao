<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 1 - Tabela</title>
	</head>
	<body>
		<table border="1" width="50%">
			<thead style="background-color: #32C731; color: #000">
				<tr>
					<th colspan="5">Tabela de Serviços Mecânicos</th>
				</tr>
			</thead>
			<tbody>
				<tr>
						<th rowspan="5"  style="background-color: #2E697D; color: #000">Nacionais</th>
						<th style="background-color: #ABABAD; color: #000">Veiculos</th>
						<th style="background-color: #ABABAD; color: #000">Serviços</th>
						<th style="background-color: #ABABAD; color: #000">Tempo Previsto</th>
						<th style="background-color: #ABABAD; color: #000">Valor</th>
				</tr>
				<tr>
					<td>Caminhonete S10</td>
					<td>Suspensão</td>
					<td>3 horas e 25 minutos</td>
					<td>350,0</td>
				</tr>
				<tr>
					<td>Caminhonete Rager</td>
					<td>Freio</td>
					<td>3 horas e 45 minutos</td>
					<td>200</td>
				</tr>
				<tr>
					<td>Caminhonete Hilux</td>
					<td>Troca de Bateria</td>
					<td>30 minutos</td>
					<td>25,00</td>
				</tr>
				<tr>
					<td>Caminhonete D10</td>
					<td>Alinhamento</td>
					<td>1 hora e 40 minutos</td>
					<td>220,00</td>
				</tr>
			</tbody>
		</table>
	</body>
