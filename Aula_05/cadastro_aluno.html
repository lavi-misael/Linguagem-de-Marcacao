<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de aluno</title>
	</head>
	<body>
		<header>
			<h1 style="text-align: center">Cadastro de Aluno<h1>
			<hr>
		</header>
		<form action="#" method="POST">
			<label for="nome">Nome do aluno: </label>
			<br>
			<input type="text" id="nome" name="nome" placeholder="Nome do aluno..." minlength="3" maxlength="255">
			<br><br>
			
			<label for="ra">Registro do aluno: </label>
			<br>
			<input type="text" id="ra" name="ra" placeholder="Registro..." value="20261015" disabled>
			<br><br>
			
			<label for="email">E-mail do aluno: </label>
			<br>
			<input type="email" id="email" name="email" placeholder="email@email.com" required>
			<br><br>
			
			<label for="teledone">Telefone do aluno: </label>
			<br>
			<input type="tel" id="teledone" name="teledone" placeholder="(00)00000-0000" required>
			<br><br>
			
			<label for="data_nascimento">Data de Nascimento: </label>
			<br>
			<input type="date" id="data_nascimento" name="data_nascimento" max="2009-12-30" required>
			<br><br>
			
			<label for="idade">Idade: </label>
			<br>
			<input type="number" id="idade" name="idade" min= "17" max="100" required>
			<br><br>
			
			<label for="genero">Gênero: </label>
			<br>
			<input type="radio" id="masculino" name="genero" value="Maculino" required>Maculino
			<br>
			<input type="radio" id="feminino" name="genero" value="Feminino">Feminino
			<br><br>
			<input type="radio" id="outros" name="genero" value="Outros">Outros
			<br><br>
			<select name="turma" id="turma">
				<option value="">Selecione...</option>
				<option value="1EMA">1° EM A</option>
				<option value="1EMB">1° EM B</option>
				<option value="2EMA">2° EM A</option>
				<option value="2EMB">2° EM B</option>
				<option value="3EMA">3° EM A</option>
				<option value="3EMB">3° EM B</option>
			</select>
			<br><br>
			
			<label for="foto">Foto aluno: </label>
			<br>
			<input type="file" id="foto" name="foto" required>
			 <br><br>
			
			<label for="comentarios">Reclamações, comentarios e elogios... </label>
			<br><br>
			<textarea id="comentarios" name="comentarios" placeholder="Texto..."></textarea>
			<br><br>
			
			<input type="checkbox" id="termos" name="termos" required > Li e aceito os termos e condições
			<br>
			<input type="checkbox" id="notificacoes" name="notificacoes" > Aceito receber notifiações
			
			<br><br>
			
			
			
			<input type="submit" value="Cadastrar aluno">
		</form>
	</body>
</html>
