<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de Usuário</title>
	</head>
	<body>
		<!--Criando o formulário
		<form> - tag de formulario
		atributo"action" aponta para uma página
		atributo "method":
					- GET: passa os dados pela URL
					- POST: passa os dados pelo corpo
		-->
		<form action="#" method="POST">
			<!-- Label - rótulo do campo -->
			<label>Nome Completo:</label>
			<br>
			<!-- INPUT -> campo de entrada de dados 
				TYPE -> tipo do campo
				ID -> indentificador (para javascript)
				NAME -> indentificador (para PHP)
			-->
			<input type="text" id="nome" name="nome">
			<br><br>
			<input type="submit" value="Cadastrar">
		</form>
	</body>
</html>
